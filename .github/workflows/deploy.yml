name: Deploy Static Site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          
      - name: Install dependencies
        run: npm ci

      - name: Prepare for Static Export
        run: |
          # 1. Delete Admin pages and server actions to prepare static site
          rm -rf src/app/admin
          rm -rf src/app/add-content
          rm -f src/app/actions.ts
          
          # 2. Mock admin actions to avoid session errors during build
          mkdir -p src/app/admin
          cat << 'EOF' > src/app/admin/actions.ts
          export async function loginUser() { return { success: false }; }
          export async function logoutUser() { return { success: true }; }
          export async function checkSessionUser() { return { isLoggedIn: false }; }
          EOF

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "file:./dev.db"
        run: npx prisma generate

      - name: Build with Next.js
        env:
          DATABASE_URL: "file:./dev.db"
          GITHUB_ACTIONS: "true"
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
